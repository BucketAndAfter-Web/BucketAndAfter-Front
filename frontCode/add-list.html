<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>버킷리스트 추가</title>
    <link rel="stylesheet" href="CSS/nav.css" />
    <link rel="stylesheet" href="CSS/addList.css" />
    <link rel="stylesheet" href="CSS/main.css" />
  </head>
  <body>
    <nav>
      <h1><a href="main.html">BucketAndAfter</a></h1>
      <button type="button" onclick="location.href = 'add-list.html'">
        + 버킷리스트 추가
      </button>
    </nav>

    <main>
      <h1 class="add-list-title">새 버킷리스트</h1>
      <form id="bucketForm">
        <div class="contents">
          <div class="content">
            <h2>제목</h2>
            <textarea
              id="listTitle"
              placeholder="예: 부산 여행 가기"
              required
            ></textarea>
          </div>
          <div class="content">
            <h2>세부 사항</h2>
            <textarea
              id="listInfo"
              placeholder="예: 2박 3일, 일출보기"
              required
            ></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" id="addButton" class="button">추가</button>
            <button
              type="button"
              onclick="window.location.href = 'main.html'"
              id="cancelButton"
              class="button"
            >
              취소
            </button>
          </div>
        </div>
      </form>
    </main>

    <script>
      document
        .getElementById("bucketForm")
        .addEventListener("submit", function (event) {
          event.preventDefault(); //폼 제출 이후 바로 화면전환 안되게 설정.

          const bucketLists = JSON.parse(
            localStorage.getItem("bucketLists") || "[]",
          ); //원래 스토리지 데이터 가져오기
          bucketLists.push({
            title: document.getElementById("listTitle").value.trim(), //제목 입력창의 텍스트 가져와서 title에 저장
            info: document.getElementById("listInfo").value.trim(), //위에랑 같은 기능인데 이제 세부사항으로
          }); //title, info 읽어온 값들을 버킷리스트에 -마지막 요소로 push
          bucketLists.className = "bucketLists"; //버킷리스트에 클래스 이름 설정
          localStorage.setItem("bucketLists", JSON.stringify(bucketLists)); //push 된 버킷 리스트 데이터를 로컬 스토리지에 저장
          window.location.href = "main.html"; //메인으로 화면 이동
        });
    </script>
  </body>
</html>
