<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>버킷리스트 추가</title>
    <link rel="stylesheet" href="CSS/nav.css" />
    <link rel="stylesheet" href="CSS/addList.css" />
    <link rel="stylesheet" href="CSS/main.css" />
  </head>
  <body>
    <nav>
      <h1><a href="main.html">BucketAndAfter</a></h1>
      <button type="button" onclick="location.href = 'add-list.html'">
        + 버킷리스트 추가
      </button>
    </nav>

    <main>
      <h1 class="add-list-title">새 버킷리스트</h1>
      <form id="bucketForm" novalidate>
        <div class="contents">
          <div class="content">
            <h2>제목</h2>
            <input
              type="text"
              id="listTitle"
              placeholder="예: 부산 여행 가기"
              required
            />
          </div>
          <div class="content">
            <h2>세부 사항</h2>
            <textarea
              id="listInfo"
              placeholder="예: 2박 3일, 일출보기"
              required
            ></textarea>
          </div>
          <p id="formError" class="form-error" role="alert" hidden>텍스트 필드를 전부 채워주세요.</p>
          <div class="form-actions">
            <button type="submit" id="addButton" class="button">추가</button>
            <button
              type="button"
              onclick="window.location.href = 'main.html'"
              id="cancelButton"
              class="button"
            >
              취소
            </button>
          </div>
        </div>
      </form>
    </main>

    <script>
      const bucketForm = document.getElementById("bucketForm");
      const titleField = document.getElementById("listTitle");
      const infoField = document.getElementById("listInfo");
      const formError = document.getElementById("formError");
      const textFields = [titleField, infoField];

      function refreshFieldErrors() {
        const allFieldsFilled = textFields.every((field) => field.value.trim() !== "");
        formError.hidden = allFieldsFilled;

        textFields.forEach((field) => {
          const isInvalid = field.value.trim() === "" && !allFieldsFilled;
          field.classList.toggle("input-error", isInvalid);
          field.setAttribute("aria-invalid", String(isInvalid));
        });
      }

      textFields.forEach((field) => field.addEventListener("input", refreshFieldErrors));

      bucketForm.addEventListener("submit", function (event) {
        event.preventDefault();

        refreshFieldErrors();

        const firstEmptyField = textFields.find((field) => field.value.trim() === "");
        if (firstEmptyField) {
          firstEmptyField.focus();
          return;
        }

        const bucketLists = JSON.parse(
          localStorage.getItem("bucketLists") || "[]",
        ); //원래 스토리지 데이터 가져오기
        bucketLists.push({
          title: titleField.value.trim(),
          info: infoField.value.trim(),
        });
        localStorage.setItem("bucketLists", JSON.stringify(bucketLists));
        window.location.href = "main.html";
      });
    </script>
  </body>
</html>
