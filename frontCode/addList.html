<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버킷리스트 추가</title>
    <link rel="stylesheet" href="nav.css">
    <style>
        .textField {
            width: 50%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        #bucketForm {
            border: 2px solid #355e3b;
            text-align: left;
            border-radius: 10px;
            padding: 20px;
            margin: 0px 100px;
        }
        body {
            font-family: Arial, sans-serif;
            
        }
        input[type="text"] {
            margin: 10px;
            padding: 10px 1100px 10px 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border: 1px solid #355e3b;
            border-radius: 5px;
        }
        h1{
            margin: 0px 0 30px 100px;
        }
    </style>
</head>
<body>
    <iframe src="nav.html" class="headerTemplate"></iframe>

    <h1>새 버킷리스트</h1>
    
    <form id="bucketForm">
        <h2>제목</h2>
        <input type="text" id="listTitle" placeholder="예: 부산 여행 가기" required>
        <br>
        <h2>세부 사항</h2>
        <input type="text" id="listInfo" placeholder="예: 2박 3일, 일출보기" required>
        <br>
        <button type="button" onclick="window.location.href='main.html'">취소</button>
        <button type="submit">추가</button>
    </form>

    <script>
        document.getElementById("bucketForm").addEventListener("submit", function (event) {
            event.preventDefault();//폼 제출 이후 바로 화면전환 안되게 설정. 

            const bucketLists = JSON.parse(localStorage.getItem("bucketLists") || "[]");//원래 스토리지 데이터 가져오기
            bucketLists.push({
                title: document.getElementById("listTitle").value.trim(),//제목 입력창의 텍스트 가져와서 title에 저장
                info: document.getElementById("listInfo").value.trim()//위에랑 같은 기능인데 이제 세부사항으로
            });//title, info 읽어온 값들을 버킷리스트에 -마지막 요소로 push
            bucketLists.className = "bucketLists";//버킷리스트에 클래스 이름 설정
            localStorage.setItem("bucketLists", JSON.stringify(bucketLists));//push 된 버킷 리스트 데이터를 로컬 스토리지에 저장
            window.location.href = "main.html";//메인으로 화면 이동
        });
    </script>
</body>
</html>
