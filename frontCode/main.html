
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BucketAndAfter</title>
    <link rel="stylesheet" href="nav.css">
    <style>
        #listTable {
            width: 80%;
            border-collapse: separate;
            border-spacing: 0 0px;
            margin: 0 auto;
        }

        #listTable th,
        #listTable td {
            border: 1px solid #000;
            padding: 12px;
        }

        #listTable th {
            background-color: #f2f2f2;
        }

        #listTable tbody tr {
            cursor: pointer;
        }

        #listTable tbody tr.completed {
            color: #828282;
            text-decoration: line-through;
        }

    </style>
</head>
<body>
    <iframe src="nav.html" class="headerTemplate" target="_top"></iframe>
    <table id="listTable">
        <thead>
            <tr>
            <th></th>
            <th><b>제목</b></th>
            <th><p>세부 사항</p></th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script>
        const bucketLists = JSON.parse(localStorage.getItem("bucketLists") || "[]");//버킷 리스트 로컬 스토리지에 있는거 가져와서 선언
        const listTable = document.getElementById("listTable");//테이블 가져와서 선언
        const listTableBody = listTable.querySelector("tbody");//테이블의 바디 가져와서 선언

        bucketLists.forEach(
            function (bucketList, index) {//포이치문 돌리기
                const newRow = document.createElement("tr");//tr 생성
                newRow.classList.toggle("completed", bucketList.completed === true);//달성 했는지 확인 후 css 클래스 설정
                newRow.addEventListener("click", function () {
                    const page = bucketList.completed ? "yourSucceedBucket.html" : "writeThoughts.html";
                    //달성 여부 확인 후 소감 작성 페이지와 소감 확인 페이지 어느쪽으로 갈건지 설정
                    window.location.href = page + "?index=" + index;//인덱스 붙여서 화면 이동
                });//리스트 클릭 시 클릭이벤트

                //여기부터 셀 생성, 데이터 넣기
                const indexCell = document.createElement("td");//첫번째 셀 생성
                indexCell.textContent = index;//텍스트에 인덱스 번호 넣기
                newRow.appendChild(indexCell);//tr에 넣기

                [bucketList.title, bucketList.info].forEach(function (value) {//제목, 세부사항 셀
                    const cell = document.createElement("td");//셀 만들기
                    cell.textContent = value;//텍스트에 제목 또는 세부사항(value) 넣기
                    newRow.appendChild(cell);//tr에 넣기
                });
                listTableBody.appendChild(newRow);//table에 tr 넣기
            }
        );
    </script>
</body>
</html>
