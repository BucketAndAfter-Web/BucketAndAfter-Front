<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BucketAndAfter</title>
    <link rel="stylesheet" href="nav.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial;
      }

      body {
        font-size: 16px;
        background: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .container {
        padding: 44px 120px;
        flex: 1;
      }

      h1 {
        font-size: 28px;
        font-weight: bold;
        color: #000000;
        margin-bottom: 24px;
      }

      #listTable {
        background-color: #ffffff;
        width: 100%;
        border-radius: 6px;
        border: 2px solid #6f9475;
        border-collapse: separate;
        border-spacing: 0px;
        overflow: hidden;
        table-layout: fixed;
      }

      #listTable th {
        font-size: 16px;
        font-weight: bold;
        color: #000000;
        text-align: left;
        padding: 19px;
        background-color: #dce8d8;
        border-bottom: 2px solid #6f9475;
      }

      #listTable td {
        padding: 19px;
        border-bottom: 2px solid #6f9475;
        padding: 19px;
        border-bottom: 2px solid #355e3b;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #listTable tbody tr {
        cursor: pointer;
        transition: transform 0.15s;
      }

      #listTable tbody tr:hover td {
        background-color: #f2f2f2;
      }

      #listTable tbody tr.completed td {
        color: #777777;
      }
      #listTable tbody tr.completed td:nth-child(2) {
        text-decoration: line-through;
      }
      #listTable tbody tr.completed td:first-child::after {
        color: var(--highlight);
        font-weight: 700;
      }
      #listTable tbody tr:last-child td {
        border-bottom: none;
      }

      #emptyMessage {
        display: none;
        text-align: center;
        padding: 48px 20px;
        color: #777777;
      }
      #emptyMessage .btn {
        margin-top: 14px;
      }

      footer {
        margin-top: 80px;
        height: 64px;
        flex-shrink: 0;
        background-color: #dce8d8;
        border-bottom: 2px solid #6f9475;
      }
    </style>
  </head>
  <body>
    <iframe src="nav.html" class="headerTemplate"></iframe>

    <main class="container">
      <h1 class="page-title">나의 버킷리스트</h1>

      <table id="listTable">
        <thead>
          <tr>
            <th>No.</th>
            <th>제목</th>
            <th>세부 사항</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div id="emptyMessage" class="card">
        아직 적어둔 버킷리스트가 없어요.<br />
        <a href="addList.html" class="btn">첫 버킷리스트 적기</a>
      </div>
    </main>

    <footer></footer>

    <script>
      const bucketLists = JSON.parse(
        localStorage.getItem("bucketLists") || "[]",
      );
      const listTable = document.getElementById("listTable");
      const listTableBody = listTable.querySelector("tbody");

      if (bucketLists.length === 0) {
        listTable.style.display = "none";
        document.getElementById("emptyMessage").style.display = "block";
      }

      bucketLists.forEach(function (bucketList, index) {
        const newRow = document.createElement("tr");
        newRow.classList.toggle("completed", bucketList.completed === true);
        newRow.addEventListener("click", function () {
          const page = bucketList.completed
            ? "yourSucceedBucket.html"
            : "writeThoughts.html";
          window.location.href = page + "?index=" + index;
        });

        const indexCell = document.createElement("td");
        indexCell.textContent = index + 1;
        newRow.appendChild(indexCell);

        [bucketList.title, bucketList.info].forEach(function (value) {
          const cell = document.createElement("td");
          cell.textContent = value;
          newRow.appendChild(cell);
        });
        listTableBody.appendChild(newRow);
      });
      const resetArea = document.getElementById("resetArea");
    </script>
  </body>
</html>
