<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>달성 완료 버킷</title>
    <link rel="stylesheet" href="nav.css">
    <style>
        #thoughts {
            width: 50%;
            border: 1px solid #000;
            padding: 10px;
            box-sizing: border-box;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body>
    <iframe src="nav.html" class="headerTemplate"></iframe>
    <h2 id="bucketTitle"></h2>
    <p id="bucketInfo"></p>
    <p id="thoughts"></p>

    <script>
        const bucketIndex = Number(new URLSearchParams(window.location.search).get("index"));
        const bucketLists = JSON.parse(localStorage.getItem("bucketLists") || "[]");
        const bucketList = bucketLists[bucketIndex];

        if (!bucketList || bucketList.completed !== true) {
            alert("달성 완료된 버킷을 찾을 수 없습니다.");
            window.location.href = "main.html";
        } else {
            document.getElementById("bucketTitle").textContent = bucketList.title;
            document.getElementById("bucketInfo").textContent = bucketList.info;
            document.getElementById("thoughts").textContent = bucketList.thoughts || "작성된 소감이 없습니다.";
        }
    </script>
</body>
</html>
